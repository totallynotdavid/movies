[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tools]
bun = "1.4.3"
node = "26.12.0"

[tasks.install]
description = "Install dependencies from bun.lock without resolving"
run = "bun install --frozen-lockfile"

[tasks.prepare]
description = "Generate the .void types used by lint, typecheck, test, and build"
run = "vp exec void prepare"

[tasks.lint]
description = "Check lint rules and formatting, Markdown included"
depends = ["prepare"]
run = ["vp lint --deny-warnings", "vp fmt --check"]

[tasks.fix]
description = "Apply safe lint fixes and format every file"
depends = ["prepare"]
run = ["vp lint --fix --deny-warnings", "vp fmt"]

[tasks.typecheck]
description = "Type-check the application"
depends = ["prepare"]
run = "vp check --no-fmt --no-lint"

[tasks.test]
description = "Run the unit tests"
depends = ["prepare"]
run = "vp test"

[tasks.build]
description = "Build the application"
depends = ["prepare"]
run = "vp build"

[tasks.check]
description = "Run every check CI runs"
depends = ["lint", "typecheck", "test", "build"]

[tasks.dev]
description = "Set up the local database and start the dev server"
depends = ["setup"]
run = "vp dev"

[tasks.setup]
description = "Apply local migrations and insert the committed fixtures"
run = "bun scripts/setup.ts"

[tasks.preview]
description = "Preview the production build"
run = "vp preview"

[tasks."db:migrate"]
description = "Apply migrations to the local database"
run = "vp exec void db migrate"

[tasks."db:migrate:remote"]
description = "Apply migrations to the remote database"
run = "vp exec void db migrate --remote"

[tasks."db:seed"]
description = "Reset the local database and run db/seed.ts"
run = "vp exec void db seed"

[tasks."fixtures:fetch"]
description = "Refresh the committed fixtures from TMDB (needs TMDB_READ_ACCESS_TOKEN in .env)"
run = "bun --env-file .env scripts/fetch-metadata.ts --all"

[tasks."fixtures:trending"]
description = "Refresh trending fixtures from TMDB (needs TMDB_READ_ACCESS_TOKEN in .env)"
run = "bun --env-file .env scripts/fetch-metadata.ts --trending"

[tasks.deploy]
description = "Deploy to Void Cloud (needs VOID_TOKEN)"
run = "vp exec void deploy"

[tasks.release]
description = "Check, apply remote migrations, and deploy"
depends = ["check"]
run = ["mise run db:migrate:remote", "mise run deploy"]

[tasks.recover]
description = "Migrate, seed, and deploy a remote that was reset or recreated"
run = ["mise run db:migrate:remote", "mise run db:seed", "mise run deploy"]

[tasks.audit]
description = "Print the fallow audit as a pull request comment (run prepare first)"
run = "vp dlx fallow audit --format pr-comment-github --quiet"
