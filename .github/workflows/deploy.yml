name: Deploy
on:
  push:
    branches: [master]
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: mise run install
      - run: mise run check
      - run: mise run deploy
        env:
          VOID_TOKEN: ${{ secrets.VOID_TOKEN }}
